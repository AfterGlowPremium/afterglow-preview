name: satcv refresh
on:
  schedule:
    - cron: '*/15 10-23,0-1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: satcv, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/satcv.js
      - run: node tools/buoys.js || true
      - name: Commit if changed
        run: |
          git diff --quiet data/satcv-sunset.json data/buoys.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/satcv-sunset.json data/buoys.json
          git commit -m "satcv auto-refresh $(TZ=America/New_York date +%H:%M)"
          git pull --rebase origin main && git push origin HEAD:main
