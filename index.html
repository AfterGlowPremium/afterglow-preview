<style>
  html,body{margin:0;height:100%;background:#120c22;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block;background:#120c22}
  #sa-probe{position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none}
  #music-btn{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2147483000;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(14,16,28,.55);color:#fff;font-size:18px;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #music-btn.on{background:rgba(255,154,90,.85);color:#111}

<body>
<!-- Shell: owns the URL, the self-update and the background music; the app runs in the iframe so its page loads never stop the song -->
<script>
  window.AG_BUILD = "d25r";
  (function () { try { fetch("version.json?ts=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
    if (!v || !v.build || v.build === window.AG_BUILD) return; var u = new URL(location.href); if (u.searchParams.get("b") === v.build) return;
    u.searchParams.set("b", v.build); location.replace(u.toString()); }).catch(function () {}); } catch (e) {} })();
</script>
<div id="sa-probe"></div>
<iframe id="app" title="Afterglow Premium" allow="geolocation; autoplay; fullscreen" src="about:blank"></iframe>
<script>
  (function () {
    var f = document.getElementById("app"), probe = document.getElementById("sa-probe");
    f.src = "app.html?b=d25r" + (location.search ? "&" + location.search.slice(1) : "") + location.hash;   // build param: busts Safari's cached app.html
    function insets() { try { var d = f.contentDocument; if (d) d.documentElement.style.setProperty("--ag-sat", probe.getBoundingClientRect().height + "px"); } catch (e) {} }
    var last = "";
    function sync() {   // mirror the app's address (mode, spot, …) and title into the real address bar so links stay shareable
      try { var l = f.contentWindow.location; if (!/app\.html$/.test(l.pathname)) return;
        var want = l.search + l.hash; if (want !== last) { last = want; history.replaceState(null, "", location.pathname + want); }
        if (window.AGMusic) AGMusic.hook(f.contentWindow);
        var t = f.contentDocument.title; if (t && t !== document.title) document.title = t; } catch (e) {}
    }
    f.addEventListener("load", function () { insets(); sync(); if (window.AGMusic) AGMusic.hook(f.contentWindow); });
    addEventListener("resize", insets);
    setInterval(sync, 400);
  })();
</script>
<script src="music.js?v=m5"></script>
</body>
