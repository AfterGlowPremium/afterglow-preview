<!-- Shell: owns the URL, the self-update and the background music; the app runs in the iframe so its page loads never stop the song -->
<script>try{var m=/[?&]steam=(\w+)/i.exec(location.search);if(m){if(m[1].toLowerCase()==="off")sessionStorage.removeItem("agSteam");else sessionStorage.setItem("agSteam",m[1].toLowerCase())}}catch(e){}</script>
<script>
  window.AG_BUILD = "d28r";
  (function () { function chk() { try { fetch("version.json?ts=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
    if (!v || !v.build || v.build === window.AG_BUILD) return; var k = "agUpd:" + v.build, n = +(sessionStorage.getItem(k) || 0); if (n >= 2) return; sessionStorage.setItem(k, n + 1);
    var u = new URL(location.href); u.searchParams.set("b", v.build); u.searchParams.set("r", Date.now().toString(36)); location.replace(u.toString()); }).catch(function () {}); } catch (e) {} }
    chk(); document.addEventListener("visibilitychange", function () { if (!document.hidden) chk(); }); })();   // d28b: re-check on return; fresh URL each try (iOS caches per URL), max 2 tries per build
</script>
<div id="sa-probe"></div>
<iframe id="app" title="Afterglow Premium" allow="geolocation; autoplay; fullscreen" src="about:blank"></iframe>
<script>
  (function () {
    var f = document.getElementById("app"), probe = document.getElementById("sa-probe");
    var q = new URLSearchParams(location.search); q.delete("b"); q.delete("r"); var qs = q.toString(); f.src = "app.html?b=d28r" + (qs ? "&" + qs : "") + location.hash;   // build param: busts Safari's cached app.html
    function insets() { try { var d = f.contentDocument; if (d) d.documentElement.style.setProperty("--ag-sat", probe.getBoundingClientRect().height + "px"); } catch (e) {} }
    var last = "";
    function sync() {   // mirror the app's address (mode, spot, …) and title into the real address bar so links stay shareable
      try { var l = f.contentWindow.location; if (!/app\.html$/.test(l.pathname)) return;
        var want = l.search + l.hash; if (want !== last) { last = want; history.replaceState(null, "", location.pathname + want); }
        if (window.AGMusic) AGMusic.hook(f.contentWindow);
        var t = f.contentDocument.title; if (t && t !== document.title) document.title = t; } catch (e) {}
    }
    f.addEventListener("load", function () { insets(); sync(); if (window.AGMusic) AGMusic.hook(f.contentWindow); });
    addEventListener("resize", insets);
    setInterval(sync, 400);
  })();
</script>
